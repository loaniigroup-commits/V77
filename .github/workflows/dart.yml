name: Build Experts Legal Consultation APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter Version
        run: flutter --version

      - name: Generate Android Project
        run: flutter create . --platforms=android

      - name: Remove Generated Tests
        run: rm -rf test

      - name: Install Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-36" \
          "build-tools;36.0.0"

      - name: Force App Compile SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          for p in files:
              if not p.exists():
                  continue

              text = p.read_text()

              text = text.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 36"
              )

              text = text.replace(
                  "compileSdk flutter.compileSdkVersion",
                  "compileSdk 36"
              )

              text = text.replace(
                  "compileSdkVersion flutter.compileSdkVersion",
                  "compileSdkVersion 36"
              )

              p.write_text(text)
              print(f"Updated {p}")

          PY

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Fix File Picker Android SDK
        run: |
          echo "Searching for file_picker Android Gradle file..."

          FILE_PICKER_GRADLE=$(find "$HOME/.pub-cache" \
            -path "*/file_picker-*/android/build.gradle" \
            | head -1)

          FILE_PICKER_KTS=$(find "$HOME/.pub-cache" \
            -path "*/file_picker-*/android/build.gradle.kts" \
            | head -1)

          if [ -n "$FILE_PICKER_GRADLE" ]; then
            echo "Found: $FILE_PICKER_GRADLE"

            sed -i \
              's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' \
              "$FILE_PICKER_GRADLE"

            sed -i \
              's/compileSdk flutter.compileSdkVersion/compileSdk 36/g' \
              "$FILE_PICKER_GRADLE"

            sed -i \
              -E 's/compileSdkVersion [0-9]+/compileSdkVersion 36/g' \
              "$FILE_PICKER_GRADLE"

            sed -i \
              -E 's/compileSdk [0-9]+/compileSdk 36/g' \
              "$FILE_PICKER_GRADLE"

            echo "Updated file_picker build.gradle:"
            cat "$FILE_PICKER_GRADLE"

          elif [ -n "$FILE_PICKER_KTS" ]; then
            echo "Found: $FILE_PICKER_KTS"

            sed -i \
              's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' \
              "$FILE_PICKER_KTS"

            sed -i \
              -E 's/compileSdk = [0-9]+/compileSdk = 36/g' \
              "$FILE_PICKER_KTS"

            echo "Updated file_picker build.gradle.kts:"
            cat "$FILE_PICKER_KTS"

          else
            echo "ERROR: file_picker Android Gradle file not found."
            exit 1
          fi

      - name: Flutter Analyze
        run: flutter analyze lib --no-fatal-infos

      - name: Clean Before Build
        run: flutter clean

      - name: Restore Packages
        run: flutter pub get

      - name: Fix File Picker Again After Clean
        run: |
          FILE_PICKER_GRADLE=$(find "$HOME/.pub-cache" \
            -path "*/file_picker-*/android/build.gradle" \
            | head -1)

          FILE_PICKER_KTS=$(find "$HOME/.pub-cache" \
            -path "*/file_picker-*/android/build.gradle.kts" \
            | head -1)

          if [ -n "$FILE_PICKER_GRADLE" ]; then

            sed -i \
              's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' \
              "$FILE_PICKER_GRADLE"

            sed -i \
              's/compileSdk flutter.compileSdkVersion/compileSdk 36/g' \
              "$FILE_PICKER_GRADLE"

            sed -i \
              -E 's/compileSdkVersion [0-9]+/compileSdkVersion 36/g' \
              "$FILE_PICKER_GRADLE"

            sed -i \
              -E 's/compileSdk [0-9]+/compileSdk 36/g' \
              "$FILE_PICKER_GRADLE"

          elif [ -n "$FILE_PICKER_KTS" ]; then

            sed -i \
              's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' \
              "$FILE_PICKER_KTS"

            sed -i \
              -E 's/compileSdk = [0-9]+/compileSdk = 36/g' \
              "$FILE_PICKER_KTS"

          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          echo "Checking APK..."
          ls -lh build/app/outputs/flutter-apk/

          test -f \
          build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Experts APK
        uses: actions/upload-artifact@v4
        with:
          name: Experts-Legal-Consultation-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
